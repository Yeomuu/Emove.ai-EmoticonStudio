[build]
  command = "pnpm build"
  publish = "dist"

[build.environment]
  SECRETS_SCAN_OMIT_KEYS = "VITE_AI_MODE,OPENAI_PROMPT_MODEL,OPENAI_TRANSCRIBE_MODEL,OPENAI_IMAGE_MODEL,OPENAI_IMAGE_BACKGROUND,OPENAI_IMAGE_SIZE,OPENAI_IMAGE_QUALITY,OPENAI_IMAGE_OUTPUT_FORMAT,OPENAI_IMAGE_OUTPUT_COMPRESSION,OPENAI_IMAGE_CONCURRENCY,OPENAI_CHARACTER_VARIATIONS,VITE_MEDIAPIPE_WASM_PATH,VITE_POSE_MODEL_PATH,VITE_FACE_MODEL_PATH"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
